<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NAPGAME247 - Hệ Thống Nạp Game Tự Động</title>
  <!-- Nhúng file CSS riêng -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Thanh Header (Nhấn 5 lần vào Logo để kích hoạt Admin ẩn) -->
  <header class="header">
    <div class="logo" id="siteLogo">⚡ NAPGAME247</div>
    <div class="header-title">Hệ Thống Nạp Game Tự Động 24/7</div>
  </header>

  <!-- Form Nạp Game dành cho khách hàng -->
  <main class="container">
    <h2>Nạp Game Tự Động</h2>
    <form id="orderForm">
      <div class="form-group">
        <label for="userAccount">Tài Khoản / ID Game:</label>
        <input type="text" id="userAccount" placeholder="Nhập ID hoặc tên tài khoản" required>
      </div>

      <div class="form-group">
        <label for="gameType">Chọn Game:</label>
        <select id="gameType">
          <option value="Liên Quân Mobile">Liên Quân Mobile</option>
          <option value="Free Fire">Free Fire</option>
          <option value="Genshin Impact">Genshin Impact</option>
        </select>
      </div>

      <div class="form-group">
        <label for="packageType">Chọn Gói Nạp:</label>
        <select id="packageType">
          <option value="100 Quân Huy/KC">100 Quân Huy / Kim Cương (20.000đ)</option>
          <option value="500 Quân Huy/KC">500 Quân Huy / Kim Cương (100.000đ)</option>
          <option value="1000 Quân Huy/KC">1000 Quân Huy / Kim Cương (200.000đ)</option>
        </select>
      </div>

      <button type="submit" class="btn-submit">Gửi Đơn Nạp</button>
    </form>
  </main>

  <!-- Khung Admin Modal (Mặc định ẩn) -->
  <div id="adminModal" class="admin-modal" style="display: none;">
    <div class="admin-content">
      <div class="admin-header">
        <h3>Quản Lý Đơn Hàng (Admin)</h3>
        <button class="close-btn" onclick="closeAdmin()">✕</button>
      </div>
      
      <!-- Màn hình xác thực mã PIN Admin -->
      <div id="adminAuth">
        <p>Nhập mã PIN quản trị viên:</p>
        <input type="password" id="adminPin" placeholder="Mật khẩu Admin (Ví dụ: 123456)">
        <button class="btn-submit" onclick="verifyAdmin()" style="margin-top: 10px;">Xác nhận</button>
      </div>

      <!-- Bảng danh sách đơn hàng -->
      <div id="adminPanel" style="display: none;">
        <table>
          <thead>
            <tr>
              <th>Mã đơn</th>
              <th>Tài khoản</th>
              <th>Loại Game</th>
              <th>Gói nạp</th>
              <th>Trạng thái</th>
              <th>Thao tác</th>
            </tr>
          </thead>
          <tbody id="orderTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Nhúng file JavaScript riêng -->
  <script src="script.js"></script>
</body>
</html>
